  <style>
    :root {
      --noreva-black: #1a1a1a;
      --noreva-charcoal: #2d2d2d;
      --noreva-cream: #FAF9F7;
      --noreva-ivory: #F5F4F0;
      --noreva-champagne: #E8E4DD;
      --noreva-gold: #C9A962;
      --noreva-gold-light: #D4B978;
      --noreva-taupe: #8A8279;
    }

    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    input,
    textarea {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Manrope', 'Alexandria', sans-serif;
      background-color: var(--noreva-cream);
      color: var(--noreva-black);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.01em;
    }

    [dir="rtl"],
    [lang="ar"] {
      font-family: 'Alexandria', sans-serif;
    }

    /* Typography refinements */
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Cormorant Garamond', 'Alexandria', serif;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    [dir="rtl"] h1,
    [dir="rtl"] h2,
    [dir="rtl"] h3,
    [dir="rtl"] h4,
    [dir="rtl"] h5,
    [dir="rtl"] h6 {
      font-family: 'Alexandria', sans-serif;
      letter-spacing: 0;
    }

    /* RTL text refinements */
    [dir="rtl"] p,
    [dir="rtl"] span,
    [dir="rtl"] button,
    [dir="rtl"] a {
      line-height: 1.7;
      letter-spacing: 0 !important;
    }

    [dir="rtl"] .tracking-widest,
    [dir="rtl"] .tracking-wider,
    [dir="rtl"] .uppercase {
      letter-spacing: 0 !important;
    }

    /* Scrollbar styling */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Premium button styles */
    .btn-luxury {
      background: linear-gradient(135deg, var(--noreva-black) 0%, var(--noreva-charcoal) 100%);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-luxury:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    }

    .btn-luxury-outline {
      border: 1.5px solid var(--noreva-black);
      background: transparent;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-luxury-outline:hover {
      background: var(--noreva-black);
      color: white;
    }

    /* Gold accent */
    .gold-accent {
      background: linear-gradient(135deg, var(--noreva-gold) 0%, var(--noreva-gold-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Animations */
    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slide-down {
      from {
        transform: translateY(-100%);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes slide-up {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes gentle-float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    .animate-fade-up {
      animation: fade-up 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-slide-down {
      animation: slide-down 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-slide-up {
      animation: slide-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-fade-in {
      animation: fade-in 0.4s ease-out forwards;
    }

    .animate-float {
      animation: gentle-float 4s ease-in-out infinite;
    }

    .animate-shimmer {
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }

    /* Infinite Marquee Animation */
    @keyframes marquee {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    .animate-marquee {
      animation: marquee 30s linear infinite;
    }

    /* Luxury card hover effect */
    .luxury-card {
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .luxury-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
    }

    /* Image reveal effect */
    .img-reveal {
      overflow: hidden;
    }

    .img-reveal img {
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .img-reveal:hover img {
      transform: scale(1.05);
    }

    /* Selection styling */
    ::selection {
      background: var(--noreva-champagne);
      color: var(--noreva-black);
    }
  </style>
